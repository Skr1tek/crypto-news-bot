name: Crypto news to Telegram

on:
  schedule:
    - cron: '0 5 * * *' # 08:00 Moscow (UTC+3)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-news-daily
  cancel-in-progress: false

jobs:
  send:
    if: github.ref == 'refs/heads/main' && vars.INTERACTIVE_BOT_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Ensure durable state branch
        uses: actions/github-script@v7
        with:
          script: |
            const args = {owner: context.repo.owner, repo: context.repo.repo};
            try {
              await github.rest.git.getRef({...args, ref: 'heads/bot-state'});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({...args, ref: 'refs/heads/bot-state', sha: context.sha});
            }
      - uses: actions/checkout@v4
        with:
          ref: bot-state
          path: .delivery-state
          persist-credentials: true
      - name: Send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TARGETS: ${{ secrets.TELEGRAM_TARGETS }}
          NEWS_CONFIG_PATH: ${{ vars.NEWS_CONFIG_PATH }}
          NEWS_STATE_PATH: .delivery-state/sent.sqlite3
        run: python bot.py
      - name: Persist confirmed deliveries even after partial failure
        if: always()
        working-directory: .delivery-state
        run: |
          if [ ! -f sent.sqlite3 ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f sent.sqlite3
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist confirmed Telegram deliveries"
            git push origin HEAD:bot-state
          fi

